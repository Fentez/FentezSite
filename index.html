<body>
<div id="gate" role="button" tabindex="0" aria-label="Tap to enter">
  <p class="gate-t">Tap to enter<span class="dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></p>

<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>

      <span class="badge"><i class="fas fa-gamepad"></i>gamer</span>

    <nav class="links" aria-label="My links">

        <span class="ico"><i class="fab fa-steam"></i></span>
        <span class="t"><b>Steam</b><small>Games and library</small></span>
        <i class="fas fa-arrow-up-right-from-square go"></i>

      <a href="https://discord.com/users/664172314602110976" class="link discord" target="_blank" rel="noopener noreferrer">

        <span class="t"><b>GitHub</b><small>Code and projects</small></span>
